[project]
name = "mylinux-automation"
version = "0.1.0"
description = "MyLinuxAutomation(MLA), a command-line tool for Linux software setup."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
mla = "mla:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mla"
